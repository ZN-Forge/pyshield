[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyshield-security"
version = "0.1.0"
description = "Open-source developer-focused security analysis platform for Python projects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ZN-Forge", email = "oss@zn-forge.org" }
]
keywords = ["security", "static-analysis", "ast", "vulnerability", "scanner", "pyshield", "pyshield-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/ZN-Forge/pyshield"
Repository = "https://github.com/ZN-Forge/pyshield"
Issues = "https://github.com/ZN-Forge/pyshield/issues"
Documentation = "https://github.com/ZN-Forge/pyshield#readme"

[project.scripts]
pyshield = "pyshield.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyshield"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [
    ".venv",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/pyshield/cli/*" = ["B008"]
"scripts/*" = ["S603", "S607"]
"tests/*" = ["S101", "S102", "S105", "S602", "S603", "S607"]
"tests/fixtures/*" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["^tests/fixtures/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["pyshield"]
omit = [
    "src/pyshield/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
